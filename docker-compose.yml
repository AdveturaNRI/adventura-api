services:
  postgres:
    image: postgres:16-alpine
    container_name: adventura-postgres
    restart: unless-stopped
    ports:
      - '5444:5432'
    environment:
      POSTGRES_USER: adventura
      POSTGRES_PASSWORD: adventura
      POSTGRES_DB: adventura
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adventura -d adventura']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
