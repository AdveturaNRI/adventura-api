# TLS for API/WebSocket is terminated by the existing Traefik instance.
port: 7880
log_level: info

# API key/secret pairs are mounted as a Swarm secret at this path.
key_file: /run/secrets/livekit_keys

redis:
  address: livekit_redis:6379

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true

# Provides STUN and TURN/UDP. TURN/TLS is deliberately omitted: Traefik owns
# TCP/443 and its certificate files are not available to this separate stack.
turn:
  enabled: true
  udp_port: 3478
  domain: call.adventu.ru

room:
  empty_timeout: 300
  departure_timeout: 20
